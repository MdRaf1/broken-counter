<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Simple Counter</h1>
      <p class="subtitle">Click the button to increase the count.</p>

      <div class="counter">
        <span id="count" class="count">0</span>
        <button id="incrementBtn" class="btn">Increase</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
